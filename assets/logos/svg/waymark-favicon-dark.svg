<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Way mark favicon (dark)">
  <!-- Favicon (dark): brand-dark disc with the way mark punched out as a transparent cutout.
       The south footer runs to the disc edge, breaking the ring at the bottom. -->
  <defs>
    <mask id="waymark-cut-dark">
      <!-- White reveals, black hides. The disc is revealed... -->
      <circle cx="50" cy="50" r="48" fill="white"/>
      <!-- ...then the mark, painted black, is cut out of it. -->
      <g fill="none" stroke="black" stroke-width="12" stroke-linecap="butt">
        <line x1="76" y1="37" x2="24" y2="67"/>
        <line x1="24" y1="37" x2="76" y2="67"/>
        <line x1="50" y1="52" x2="50" y2="100"/>
      </g>
      <circle cx="50" cy="23" r="8.5" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0E1233" mask="url(#waymark-cut-dark)"/>
</svg>
